# remap prefix to Control + a
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# set new panes/windows to current directory
bind c new-window -c "#{pane_current_path}"

set -g default-terminal "screen-256color"

# set window and pane index to 1 (0 by default)
set -g base-index 1
set -g pane-base-index 1

# increase scroll history
set-option -g history-limit 10000

# Set a Ctrl-b shortcut for reloading your tmux config
bind r source-file ~/.tmux.conf

# bind Vertical and Horizontal splitting
bind j split-window -v
bind C-j split-window -v

bind l split-window -h
bind C-l split-window -h

 # set window list colors - red for active and cyan for inactive
set-window-option -g window-status-style fg=brightblue #base0

set-window-option -g window-status-current-style fg=brightred,bg=colour236,bold

# ctrl+left/right cycles thru windows
bind-key C-n next-window
bind-key C-p previous-window

# Remap window navigation to vim
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# Resizing panes
bind-key -r    Right resize-pane -R 20
bind-key -r    Left resize-pane -L 20
bind-key -r    Up resize-pane -U 20
bind-key -r    Down resize-pane -D 20

set-window-option -g mode-keys vi

# Mouse mode

set -g mouse on

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# Status bar customization
set -g status-bg black
set -g status-fg white
set -g status-interval 60
set -g status-left-length 20
set -g status-justify centre
set -g status-right-length 0
set -g status-left " #[fg=blue]#S "
set -g status-right ""

# pane customization
set -g pane-border-status top
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{s|^/Users/paul.molluzzo/||:pane_current_path}"
set -g pane-border-format "#[fg=colour11, bold][#{s|/Users/paul.molluzzo|~|:pane_current_path}] #[fg=colour15]$#[fg=colour14,bold] #{pane_current_command} "

# tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
